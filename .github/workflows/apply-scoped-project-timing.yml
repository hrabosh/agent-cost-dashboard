name: Apply scoped project timing fix

on:
  push:
    branches:
      - agent/fix-scoped-project-timing

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply patch
        run: |
          git apply --check .github/scoped-project-timing.patch
          git apply .github/scoped-project-timing.patch

      - name: Install API test dependencies
        run: python -m pip install -r requirements-api.txt

      - name: Run Python tests
        run: python -m unittest discover -s tests

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Commit validated fix
        run: |
          rm .github/scoped-project-timing.patch
          rm .github/workflows/apply-scoped-project-timing.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix scoped project timing"
          git push
