name: Apply date boundary display fix

on:
  push:
    branches:
      - agent/fix-cross-midnight-date-filter

permissions:
  contents: write

concurrency:
  group: date-boundary-display-fix
  cancel-in-progress: true

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply checked source edits
        run: python .github/apply-date-boundary-display.py

      - name: Install API test dependencies
        run: python -m pip install -r requirements-api.txt

      - name: Run Python tests
        run: python -m unittest discover -s tests

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Commit validated fix
        run: |
          rm .github/apply-date-boundary-display.py
          rm .github/workflows/apply-date-boundary-display.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Handle midnight date boundaries"
          git push
